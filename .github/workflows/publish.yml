name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      PLAYWRIGHT_DOCKER: "1"
    steps:
      - name: Install Git and unzip
        run: apt-get update -qq && apt-get install -y -qq git unzip
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run CI
        run: bun run ci
      # Trusted publishing: npm authenticates this workflow via OIDC, no token.
      - name: Publish
        run: npm publish
